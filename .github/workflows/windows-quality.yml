name: Windows release quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository and release gates
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SMART_KEFU_PAUSE: "0"
      SMART_KEFU_QUIET_EXIT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Node dependencies
        working-directory: desktop
        run: npm.cmd ci --no-audit --no-fund

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Run release quality orchestration
        working-directory: desktop
        run: npm.cmd run ci:release-quality

      - name: Upload sanitized gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-quality-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/.runtime/production-release-gate/latest.json
            desktop/.runtime/production-release-gate/latest.md
            desktop/.runtime/staging-readiness-evidence/latest.json
            desktop/.runtime/staging-readiness-evidence/latest.md

  unsigned-package:
    name: Unsigned Windows package and packaged-runtime smoke
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Node dependencies
        working-directory: desktop
        run: npm.cmd ci --no-audit --no-fund

      - name: Build and verify unsigned Windows package
        working-directory: desktop
        run: npm.cmd run package:win:test

      - name: Upload sanitized package verification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-package-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            desktop/release/windows/verification/latest.json
            desktop/release/windows/verification/latest.md
            desktop/release/windows/verification/packaged-api-smoke.json
