server {
    listen 80;
    listen [::]:80;
    server_name kefu.zhenxiliye.cn;

    access_log /www/wwwlogs/kefu.zhenxiliye.cn.log;
    error_log /www/wwwlogs/kefu.zhenxiliye.cn.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/dk_project/wwwroot/kefu.zhenxiliye.cn;
        allow all;
        try_files $uri =404;
    }

    location = /WW_verify_tjHFUeC9pnqY3e5R.txt {
        root /www/dk_project/wwwroot/kefu.zhenxiliye.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kefu.zhenxiliye.cn;

    ssl_certificate /www/server/panel/vhost/cert/kefu.zhenxiliye.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kefu.zhenxiliye.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log /www/wwwlogs/kefu.zhenxiliye.cn.log;
    error_log /www/wwwlogs/kefu.zhenxiliye.cn.error.log;
    server_tokens off;
    client_max_body_size 1m;

    location = /api/wechat-work/callback {
        limit_except GET POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Read-only production readiness used by the trusted desktop client.
    # The API validates a dedicated token with no send/configuration capabilities.
    location = /api/wechat-work/readiness/export {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Authenticated callback signal stream used only by the trusted desktop API process.
    # Customer content and Enterprise WeChat credentials are never included in these events.
    location = /api/wechat-work/events/stream {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        proxy_connect_timeout 5s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    location / {
        return 404;
    }
}
